# Buildfarm Admin Deployment
server.port=8080
ui.enable=true

# Valkey/Redis Configuration
# AWS ElastiCache cluster configuration
valkey.uri=
valkey.cluster.nodes=clustercfg.buildfarm-dev.nupq12.use1.cache.amazonaws.com:6379
valkey.cluster.enabled=true
valkey.connection.timeout=2000
valkey.connection.pool.max-active=8
valkey.connection.pool.max-idle=8
valkey.connection.pool.min-idle=0
valkey.cluster.username=
valkey.cluster.password=

# SSL/TLS Configuration for ElastiCache
valkey.cluster.ssl.enabled=true
valkey.cluster.ssl.verify-peer=false
valkey.cluster.ssl.start-tls=false

# Error page configuration
server.error.whitelabel.enabled=false
server.error.include-stacktrace=on-param
server.error.include-message=always
server.error.include-binding-errors=always
