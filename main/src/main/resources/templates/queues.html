<!DOCTYPE html>
<html lang="en" 
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content})}">
<head>
    <title>BuildFarm Queues</title>
</head>
<body>
    <div id="content">
        <!-- Queue Operations Header -->
        <div class="card fade-in">
            <div class="card-header">
                <h5 class="card-title">
                    <span><i class="bi bi-list-task"></i> All Queue Operations</span>
                    <span class="status-badge status-info" id="operationCount">
                        <div class="spinner-border spinner-border-sm me-1" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        Loading...
                    </span>
                </h5>
            </div>
            <div class="card-body">
                <div class="mb-3" id="queueSummary">
                    <div class="placeholder-glow">
                        <span class="placeholder col-7"></span>
                    </div>
                    <div class="placeholder-glow mt-1">
                        <span class="placeholder col-5"></span>
                    </div>
                </div>
                
                <div class="alert alert-info d-none" id="noQueuesAlert">
                    <i class="bi bi-info-circle"></i> No queues available
                </div>
            </div>
        </div>

        <!-- Operations Table -->
        <div class="card fade-in">
            <div class="card-header">
                <h5 class="card-title">
                    <span><i class="bi bi-gear-fill"></i> All Queue Operations</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="text-center py-4" id="operationsLoading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading operations...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading queue operations...</p>
                </div>
                
                <div class="table-responsive d-none" id="operationsTableContainer">
                    <table class="table table-hover mb-0" id="operationTable">
                        <thead>
                            <tr>
                                <th class="sortable-header" data-column="index">#</th>
                                <th class="sortable-header" data-column="queueName"><i class="bi bi-collection"></i> Queue</th>
                                <th class="sortable-header" data-column="operationName"><i class="bi bi-file-text"></i> Operation</th>
                                <th class="sortable-header" data-column="stage"><i class="bi bi-diagram-3"></i> Stage</th>
                                <th class="sortable-header" data-column="queuedAt"><i class="bi bi-clock"></i> Queued At</th>
                                <th><i class="bi bi-trash"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
                
                <div class="alert alert-info m-3 d-none" id="noOperationsAlert">
                    <i class="bi bi-info-circle"></i> No operations found in any queues
                </div>
            </div>
        </div>
    </div>
</body>
</html>
