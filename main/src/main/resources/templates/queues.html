<!DOCTYPE html>
<html lang="en" 
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content})}">
<head>
    <title>BuildFarm Queues</title>
</head>
<body>
    <div id="content">
        <!-- Queue Operations Header -->
        <div class="card fade-in">
            <div class="card-header">
                <h5 class="card-title">
                    <span><i class="bi bi-list-task"></i> All Queue Operations</span>
                    <span class="status-badge status-info" id="operationCount" th:text="${operations.size()} + ' Operations'">0 Operations</span>
                </h5>
            </div>
            <div class="card-body">
                <div class="row align-items-center mb-3">
                    <div class="col-md-6">
                        <span class="text-muted">Showing operations from <strong th:text="${queueNames.size()}">0</strong> queues: 
                        <span th:each="queue, iterStat : ${queueNames}">
                            <span th:text="${queue}">queue</span><span th:unless="${iterStat.last}">, </span>
                        </span>
                        </span>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-refresh" onclick="refreshAllOperations()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh All
                        </button>
                    </div>
                </div>
                
                <div th:if="${queueNames.empty}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> No queues available
                </div>
            </div>
        </div>

        <!-- Operations Table -->
        <div class="card fade-in" th:unless="${queueNames.empty}">
            <div class="card-header">
                <h5 class="card-title">
                    <span><i class="bi bi-gear-fill"></i> All Queue Operations</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <!-- Table Controls -->
                <div class="table-controls" th:if="${operations != null and operations.size() > 0}">
                    <div class="table-search">
                        <i class="bi bi-search"></i>
                        <input type="text" id="operationSearch" placeholder="Search operations..." />
                    </div>
                    <div class="table-info">
                        <span id="operationCount" th:text="${operations.size()}">0</span> operations
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="operationTable" th:if="${operations != null and operations.size() > 0}">
                        <thead>
                            <tr>
                                <th class="sortable-header" data-column="index"><i class="bi bi-hash"></i> #</th>
                                <th class="sortable-header" data-column="queueName"><i class="bi bi-collection"></i> Queue</th>
                                <th class="sortable-header" data-column="operationName"><i class="bi bi-file-text"></i> Operation</th>
                                <th class="sortable-header" data-column="stage"><i class="bi bi-diagram-3"></i> Stage</th>
                                <th class="sortable-header" data-column="queuedAt"><i class="bi bi-clock"></i> Queued At</th>
                                <th><i class="bi bi-trash"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="operation, iterStat : ${operations}" class="operation-row">
                                <td>
                                    <span class="text-muted" th:text="${iterStat.count}">1</span>
                                </td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${operation.queueName == 'prequeue' ? 'status-warning' : (operation.queueName == 'cpu' ? 'status-success' : 'status-info')}">
                                        <i class="bi bi-collection"></i>
                                        <span th:text="${operation.queueName}">prequeue</span>
                                    </span>
                                </td>
                                <td th:data-operation-id="${operation.operationId}">
                                    <span class="fw-medium" th:text="${operation.operationName != null ? operation.operationName : operation.name}">operation-name</span>
                                </td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${operation.stage == 'QUEUED' ? 'status-warning' : (operation.stage == 'EXECUTING' ? 'status-info' : (operation.stage == 'COMPLETED' ? 'status-success' : (operation.stage == 'FAILED' ? 'status-danger' : 'status-secondary')))}">
                                        <i th:class="${operation.stage == 'QUEUED' ? 'bi bi-clock' : (operation.stage == 'EXECUTING' ? 'bi bi-gear' : (operation.stage == 'COMPLETED' ? 'bi bi-check-circle' : (operation.stage == 'FAILED' ? 'bi bi-x-circle' : 'bi bi-question-circle')))}"></i>
                                        <span th:text="${operation.stage}">QUEUED</span>
                                    </span>
                                </td>
                                <td>
                                    <small class="text-muted" th:text="${operation.queuedTimestamp != null ? operation.queuedTimestamp : operation.queuedAt}">2024-01-01T10:00:00</small>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger" 
                                            onclick="deleteOperation(this)"
                                            th:attr="data-name=${operation.operationName != null ? operation.operationName : operation.name}"
                                            title="Delete operation">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="alert alert-info m-3" th:if="${operations == null or operations.size() == 0}">
                        <i class="bi bi-info-circle"></i> No operations found in any queues
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/assets/js/queues.js}"></script>
</body>
</html>
