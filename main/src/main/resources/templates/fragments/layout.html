<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Build Farm Admin Dashboard</title>
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- BuildFarm Dashboard Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="icon" type="image/svg+svg" href="/assets/img/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png">
    <meta name="theme-color" content="#161b22">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/variables.css}">
    <link rel="stylesheet" th:href="@{/assets/css/layout.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/tables.css}">
    <link rel="stylesheet" th:href="@{/assets/css/responsive.css}">
</head>
<body>
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div th:replace="~{fragments/layout :: header}"></div>

        <!-- Content -->
        <div class="content">
            <th:block th:replace="${content}">
                <!-- Page content will be injected here -->
            </th:block>
        </div>
    </div>

    <!-- External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/assets/js/dashboard.js}"></script>
</body>
</html>

<!-- Sidebar Fragment -->
<div th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <h4><i class="bi bi-server"></i> BuildFarm</h4>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item">
            <a href="#" class="nav-link active">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </div>
    </nav>
</div>

<!-- Header Fragment -->
<div th:fragment="header" class="header">
    <div class="header-title">
        <h2><i class="bi bi-speedometer2"></i> Dashboard</h2>
    </div>
    <div class="header-actions">
        <button class="btn btn-refresh" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>
</div>
