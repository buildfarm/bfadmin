<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <!-- Server rack representation (BuildFarm) -->
  <rect x="6" y="8" width="12" height="2" rx="1" fill="url(#serverGradient)"/>
  <rect x="6" y="11" width="12" height="2" rx="1" fill="url(#serverGradient)" opacity="0.8"/>
  <rect x="6" y="14" width="12" height="2" rx="1" fill="url(#serverGradient)" opacity="0.6"/>
  
  <!-- Dashboard gauge arc -->
  <path d="M 8 22 A 8 8 0 0 1 24 22" stroke="url(#dashGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Gauge needle -->
  <line x1="16" y1="22" x2="20" y2="18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="22" r="1.5" fill="#f59e0b"/>
  
  <!-- Status indicators (small dots) -->
  <circle cx="19" cy="9" r="1" fill="#10b981"/>
  <circle cx="19" cy="12" r="1" fill="#10b981"/>
  <circle cx="19" cy="15" r="1" fill="#ef4444"/>
</svg>
